
services:
  db:
    build: ./postgres
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: spb_zoo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: visagemain0364
      POSTGRES_HOST_AUTH_METHOD: trust  # Для упрощения
    volumes:
    - postgres_data:/var/lib/postgresql/data
    ports:
    - "5432:5432"
  # Добавляем healthcheck
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: server
    restart: always
    env_file:
      - ./server/.env
    depends_on:
      db:
        condition: service_healthy  # Ждем, пока БД будет готова
    ports:
      - "5000:5000"

  client:
    build: ./client
    container_name: client
    restart: always
    env_file:
      - ./client/.env.production
    depends_on:
      - server
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
