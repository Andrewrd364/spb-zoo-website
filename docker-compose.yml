
services:
  db:
    image: postgres:17
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: spb_zoo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: visagemain0364
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/models/sbp_zoo_dump.backup:/docker-entrypoint-initdb.d/sbp_zoo_dump.backup
      - ./server/src/models/restore.sh:/docker-entrypoint-initdb.d/restore.sh
    ports:
      - "5432:5432"

  server:
    build: ./server
    container_name: server
    restart: always
    env_file:
      - ./server/.env
    depends_on:
      - db
    ports:
      - "5000:5000"

  client:
    build: ./client
    container_name: client
    restart: always
    env_file:
      - ./client/.env.production
    depends_on:
      - server
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
